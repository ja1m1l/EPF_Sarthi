AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: EPF Sentinel - EPFO claim SLA tracker (Module 2.4 - Step Functions analysis pipeline with stubbed agents)

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 29
    Architectures: [x86_64]
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: epf-sentinel
        LOG_LEVEL: INFO
    Layers:
      - !Ref SharedLayer

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  AmplifyOrigin:
    Type: String
    Default: "https://placeholder.amplifyapp.com"
    Description: Full origin URL of the Amplify-hosted frontend.

  CorsAllowedOrigins:
    Type: CommaDelimitedList
    Default: "https://placeholder.amplifyapp.com"
    Description: >-
      Comma-separated allowed CORS origins for the HTTP API and the docs
      bucket.  Normally just the Amplify origin; add http://localhost:5173
      on dev to develop the frontend against the real API.  Declared as a
      CommaDelimitedList rather than built with Fn::If because SAM collapses
      intrinsic functions inside CorsConfiguration, silently discarding
      AllowMethods and AllowHeaders.

  GitSha:
    Type: String
    Default: "local"
    Description: Short Git SHA injected by the CI pipeline / Makefile.

  MfaConfiguration:
    Type: String
    Default: "OFF"
    AllowedValues: ["OFF", "OPTIONAL", "REQUIRED"]
    Description: MFA setting for the Cognito user pool (OFF for v1, leave OPTIONAL/REQUIRED for later).

  GeminiSecretName:
    Type: String
    Default: "epf-sentinel/gemini-api-key"
    Description: Secrets Manager secret name holding the Gemini API key.

Resources:

  # Shared Lambda Layer
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "epf-sentinel-shared-${Stage}"
      Description: Shared Python utilities (logging, models)
      ContentUri: ../src/shared/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]
    Metadata:
      BuildMethod: makefile

  # DynamoDB - Claims
  ClaimsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "epf-sentinel-Claims-${Stage}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: claimId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: claimId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byStatus
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # DynamoDB - RuleChunks
  RuleChunksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "epf-sentinel-RuleChunks-${Stage}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - AttributeName: ruleSetVersion
          AttributeType: S
        - AttributeName: chunkId
          AttributeType: S
      KeySchema:
        - AttributeName: ruleSetVersion
          KeyType: HASH
        - AttributeName: chunkId
          KeyType: RANGE

  # DynamoDB - AnalysisRuns
  AnalysisRunsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "epf-sentinel-AnalysisRuns-${Stage}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - AttributeName: claimId
          AttributeType: S
        - AttributeName: runId
          AttributeType: S
      KeySchema:
        - AttributeName: claimId
          KeyType: HASH
        - AttributeName: runId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # DynamoDB - Documents
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "epf-sentinel-Documents-${Stage}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: documentId
          AttributeType: S
        - AttributeName: claimId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: documentId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByClaimId
          KeySchema:
            - AttributeName: claimId
              KeyType: HASH
            - AttributeName: documentId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # DynamoDB - StatusTransitions
  StatusTransitionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "epf-sentinel-StatusTransitions-${Stage}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - AttributeName: claimId
          AttributeType: S
        - AttributeName: transitionKey
          AttributeType: S
      KeySchema:
        - AttributeName: claimId
          KeyType: HASH
        - AttributeName: transitionKey
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # SNS - Status Notifications
  StatusNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "epf-sentinel-status-notifications-${Stage}"

  # SQS - Document Events DLQ
  DocumentEventDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "epf-sentinel-doc-events-dlq-${Stage}"
      MessageRetentionPeriod: 1209600 # 14 days

  # SQS - Document Events Queue
  DocumentEventQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "epf-sentinel-doc-events-${Stage}"
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DocumentEventDLQ.Arn
        maxReceiveCount: 3

  # SQS Queue Policy - Allow S3 to publish to DocumentEventQueue
  DocumentEventQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref DocumentEventQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3Notifications
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt DocumentEventQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:aws:s3:::epf-sentinel-docs-${Stage}-${AWS::AccountId}"

  # S3 - epf-sentinel-docs
  DocsBucket:
    Type: AWS::S3::Bucket
    DependsOn: DocumentEventQueuePolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "epf-sentinel-docs-${Stage}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended
      LifecycleConfiguration:
        Rules:
          - Id: expire-uploaded-docs
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, POST]
            AllowedOrigins: !Ref CorsAllowedOrigins
            AllowedHeaders: ["*"]
            MaxAge: 3600
      NotificationConfiguration:
        QueueConfigurations:
          - Event: "s3:ObjectCreated:*"
            Queue: !GetAtt DocumentEventQueue.Arn

  # ─── Cognito ─────────────────────────────────────────────────────────────

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "epf-sentinel-users-${Stage}"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      MfaConfiguration: !Ref MfaConfiguration
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolAddOns:
        AdvancedSecurityMode: AUDIT

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "epf-sentinel-client-${Stage}"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      PreventUserExistenceErrors: ENABLED

  # ─── CloudWatch Log Groups (14-day retention) ─────────────────────────────

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-health-${Stage}"
      RetentionInDays: 14

  CreateClaimFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-create-claim-${Stage}"
      RetentionInDays: 14

  ListClaimsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-list-claims-${Stage}"
      RetentionInDays: 14

  GetClaimFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-get-claim-${Stage}"
      RetentionInDays: 14

  RulesAgentFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-rules-agent-${Stage}"
      RetentionInDays: 14

  ClaimAgentFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-claim-agent-${Stage}"
      RetentionInDays: 14

  RulesAgentStepFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-rules-agent-step-${Stage}"
      RetentionInDays: 14

  SlaAgentFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-sla-agent-${Stage}"
      RetentionInDays: 14

  EvidenceAgentFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-evidence-agent-${Stage}"
      RetentionInDays: 14

  GrievanceAgentFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-grievance-agent-${Stage}"
      RetentionInDays: 14

  PersistRunFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-persist-run-${Stage}"
      RetentionInDays: 14

  RecordFailureFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-record-failure-${Stage}"
      RetentionInDays: 14

  StartAnalysisFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-start-analysis-${Stage}"
      RetentionInDays: 14

  GetRunFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-get-run-${Stage}"
      RetentionInDays: 14

  PresignUploadFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-presign-upload-${Stage}"
      RetentionInDays: 14

  GetDocumentFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-get-document-${Stage}"
      RetentionInDays: 14

  ExtractDocumentFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-extract-document-${Stage}"
      RetentionInDays: 14

  SweepFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-sweep-${Stage}"
      RetentionInDays: 14

  AnalysisSfnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/epf-sentinel-analysis-${Stage}"
      RetentionInDays: 14

  # ─── API Gateway HTTP API ────────────────────────────────────────────────

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Description: EPF Sentinel HTTP API
      CorsConfiguration:
        AllowHeaders: ["Content-Type", "Authorization", "X-Correlation-Id"]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowOrigins: !Ref CorsAllowedOrigins
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 100
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
              audience:
                - !Ref CognitoUserPoolClient
        # No DefaultAuthorizer — each protected function sets Auth.Authorizer explicitly.
        # The /health route is intentionally left public (no Auth block on HealthFunction).

  # ─── Lambda functions ────────────────────────────────────────────────────

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-health-${Stage}"
      CodeUri: ../src/functions/health/
      Handler: app.handler
      Description: Health-check endpoint - returns status, git sha, and UTC time (public, no auth)
      LoggingConfig:
        LogGroup: !Ref HealthFunctionLogGroup
      Environment:
        Variables:
          GIT_SHA: !Ref GitSha
          STAGE: !Ref Stage
      Events:
        HealthGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            # No Auth block — this route is intentionally public.
      Policies:
        - CloudWatchPutMetricPolicy: {}

  CreateClaimFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-create-claim-${Stage}"
      CodeUri: ../src/functions/create_claim/
      Handler: app.handler
      Description: POST /claims — create a new EPF claim (JWT-protected)
      LoggingConfig:
        LogGroup: !Ref CreateClaimFunctionLogGroup
      Environment:
        Variables:
          CLAIMS_TABLE_NAME: !Ref ClaimsTable
          STAGE: !Ref Stage
      Events:
        CreateClaimPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /claims
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClaimsTable

  ListClaimsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-list-claims-${Stage}"
      CodeUri: ../src/functions/list_claims/
      Handler: app.handler
      Description: GET /claims — list authenticated user's claims (JWT-protected)
      LoggingConfig:
        LogGroup: !Ref ListClaimsFunctionLogGroup
      Environment:
        Variables:
          CLAIMS_TABLE_NAME: !Ref ClaimsTable
          STAGE: !Ref Stage
      Events:
        ListClaimsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /claims
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClaimsTable

  GetClaimFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-get-claim-${Stage}"
      CodeUri: ../src/functions/get_claim/
      Handler: app.handler
      Description: GET /claims/{claimId} — fetch one claim (JWT-protected, tenant-scoped)
      LoggingConfig:
        LogGroup: !Ref GetClaimFunctionLogGroup
      Environment:
        Variables:
          CLAIMS_TABLE_NAME: !Ref ClaimsTable
          STAGE: !Ref Stage
      Events:
        GetClaimGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /claims/{claimId}
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClaimsTable

  RulesAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-rules-agent-${Stage}"
      CodeUri: ../src/functions/rules_agent/
      Handler: app.handler
      Description: Rules Agent — selects applicable EPFO rule timeline or abstains
      LoggingConfig:
        LogGroup: !Ref RulesAgentFunctionLogGroup
      Environment:
        Variables:
          GEMINI_SECRET_NAME: !Ref GeminiSecretName
          RULECHUNKS_TABLE_NAME: !Ref RuleChunksTable
          STAGE: !Ref Stage
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GeminiSecretName}*"
        - DynamoDBReadPolicy:
            TableName: !Ref RuleChunksTable
        - CloudWatchPutMetricPolicy: {}

  # ─── Step Functions Pipeline Lambdas ────────────────────────────────────

  ClaimAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-claim-agent-${Stage}"
      CodeUri: ../src/functions/claim_agent/
      Handler: app.handler
      Timeout: 30
      Description: "ClaimAgent (Step 1) — validates Claim and produces AnalysisInput"
      LoggingConfig:
        LogGroup: !Ref ClaimAgentFunctionLogGroup
      Environment:
        Variables:
          STAGE: !Ref Stage
          USE_STUBS: "false"
          GEMINI_SECRET_NAME: !Ref GeminiSecretName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GeminiSecretName}*"

  RulesAgentStepFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-rules-agent-step-${Stage}"
      CodeUri: ../src/functions/rules_agent_step/
      Handler: app.handler
      Timeout: 60
      Description: "RulesAgentStep (Step 2) — SFN adapter for RulesAgent"
      LoggingConfig:
        LogGroup: !Ref RulesAgentStepFunctionLogGroup
      Environment:
        Variables:
          STAGE: !Ref Stage
          USE_STUBS: "false"
          RULES_AGENT_FUNCTION_NAME: !Ref RulesAgentFunction
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref RulesAgentFunction

  SlaAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-sla-agent-${Stage}"
      CodeUri: ../src/functions/sla_agent/
      Handler: app.handler
      Timeout: 10
      Description: "SlaAgent (Step 3) — pure SLA computation"
      LoggingConfig:
        LogGroup: !Ref SlaAgentFunctionLogGroup
      Environment:
        Variables:
          STAGE: !Ref Stage

  EvidenceAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-evidence-agent-${Stage}"
      CodeUri: ../src/functions/evidence_agent/
      Handler: app.handler
      Timeout: 30
      Description: "EvidenceAgent (Step 4) — evidence retrieval and verification"
      LoggingConfig:
        LogGroup: !Ref EvidenceAgentFunctionLogGroup
      Environment:
        Variables:
          STAGE: !Ref Stage
          USE_STUBS: "false"
          GEMINI_SECRET_NAME: !Ref GeminiSecretName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GeminiSecretName}*"
        - CloudWatchPutMetricPolicy: {}

  GrievanceAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-grievance-agent-${Stage}"
      CodeUri: ../src/functions/grievance_agent/
      Handler: app.handler
      Timeout: 30
      Description: "GrievanceAgent (Step 5) — grievance draft"
      LoggingConfig:
        LogGroup: !Ref GrievanceAgentFunctionLogGroup
      Environment:
        Variables:
          STAGE: !Ref Stage
          USE_STUBS: "false"
          GEMINI_SECRET_NAME: !Ref GeminiSecretName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GeminiSecretName}*"

  PersistRunFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-persist-run-${Stage}"
      CodeUri: ../src/functions/persist_run/
      Handler: app.handler
      Timeout: 15
      Description: "PersistRun — writes completed AnalysisRun to DynamoDB (90-day TTL)"
      LoggingConfig:
        LogGroup: !Ref PersistRunFunctionLogGroup
      Environment:
        Variables:
          STAGE: !Ref Stage
          ANALYSIS_RUNS_TABLE_NAME: !Ref AnalysisRunsTable
          CLAIMS_TABLE_NAME: !Ref ClaimsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisRunsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ClaimsTable

  RecordFailureFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-record-failure-${Stage}"
      CodeUri: ../src/functions/record_failure/
      Handler: app.handler
      Timeout: 15
      Description: "RecordFailure — error sink; persists FAILED_VALIDATION or FAILED_INFRASTRUCTURE"
      LoggingConfig:
        LogGroup: !Ref RecordFailureFunctionLogGroup
      Environment:
        Variables:
          STAGE: !Ref Stage
          ANALYSIS_RUNS_TABLE_NAME: !Ref AnalysisRunsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisRunsTable

  # ─── API Lambdas for analysis pipeline ─────────────────────────────────

  StartAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-start-analysis-${Stage}"
      CodeUri: ../src/functions/start_analysis/
      Handler: app.handler
      Timeout: 29
      Description: "POST /claims/{claimId}/analyze — starts an Express SFN execution (JWT-protected)"
      LoggingConfig:
        LogGroup: !Ref StartAnalysisFunctionLogGroup
      Environment:
        Variables:
          STAGE: !Ref Stage
          CLAIMS_TABLE_NAME: !Ref ClaimsTable
          ANALYSIS_RUNS_TABLE_NAME: !Ref AnalysisRunsTable
          DOCUMENTS_TABLE_NAME: !Ref DocumentsTable
          ANALYSIS_SFN_ARN: !Ref AnalysisSfn
      Events:
        StartAnalysisPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /claims/{claimId}/analyze
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClaimsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisRunsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DocumentsTable
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt AnalysisSfn.Name

  GetRunFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-get-run-${Stage}"
      CodeUri: ../src/functions/get_run/
      Handler: app.handler
      Timeout: 29
      Description: "GET /claims/{claimId}/runs[/{runId}] — list or fetch AnalysisRuns (JWT-protected)"
      LoggingConfig:
        LogGroup: !Ref GetRunFunctionLogGroup
      Environment:
        Variables:
          STAGE: !Ref Stage
          CLAIMS_TABLE_NAME: !Ref ClaimsTable
          ANALYSIS_RUNS_TABLE_NAME: !Ref AnalysisRunsTable
      Events:
        GetRunGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /claims/{claimId}/runs/{runId}
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
        ListRunsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /claims/{claimId}/runs
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ClaimsTable
        - DynamoDBReadPolicy:
            TableName: !Ref AnalysisRunsTable

  # ─── Document Intake Lambdas ──────────────────────────────────────────

  PresignUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-presign-upload-${Stage}"
      CodeUri: ../src/functions/presign_upload/
      Handler: app.handler
      Timeout: 10
      Description: "POST /claims/{claimId}/documents — generates presigned S3 POST URL (JWT-protected)"
      LoggingConfig:
        LogGroup: !Ref PresignUploadFunctionLogGroup
      Environment:
        Variables:
          STAGE: !Ref Stage
          CLAIMS_TABLE_NAME: !Ref ClaimsTable
          DOCUMENTS_TABLE_NAME: !Ref DocumentsTable
          DOCS_BUCKET_NAME: !Ref DocsBucket
      Events:
        PresignUploadPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /claims/{claimId}/documents
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ClaimsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DocumentsTable
        - S3CrudPolicy:
            BucketName: !Ref DocsBucket

  GetDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-get-document-${Stage}"
      CodeUri: ../src/functions/get_document/
      Handler: app.handler
      Timeout: 10
      Description: "GET /claims/{claimId}/documents/{documentId} — fetch document metadata (JWT-protected)"
      LoggingConfig:
        LogGroup: !Ref GetDocumentFunctionLogGroup
      Environment:
        Variables:
          STAGE: !Ref Stage
          CLAIMS_TABLE_NAME: !Ref ClaimsTable
          DOCUMENTS_TABLE_NAME: !Ref DocumentsTable
      Events:
        GetDocumentGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /claims/{claimId}/documents/{documentId}
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ClaimsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DocumentsTable

  ExtractDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-extract-document-${Stage}"
      CodeUri: ../src/functions/extract_document/
      Handler: app.handler
      Timeout: 120
      MemorySize: 512
      Description: "ExtractDocument — extracts text from uploaded claim documents via native PDF or Gemini VLM"
      LoggingConfig:
        LogGroup: !Ref ExtractDocumentFunctionLogGroup
      Environment:
        Variables:
          STAGE: !Ref Stage
          CLAIMS_TABLE_NAME: !Ref ClaimsTable
          DOCUMENTS_TABLE_NAME: !Ref DocumentsTable
          DOCS_BUCKET_NAME: !Ref DocsBucket
          GEMINI_SECRET_NAME: !Ref GeminiSecretName
      Events:
        DocumentQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt DocumentEventQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ClaimsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DocumentsTable
        - S3ReadPolicy:
            BucketName: !Ref DocsBucket
        - SQSPollerPolicy:
            QueueName: !GetAtt DocumentEventQueue.QueueName
        - CloudWatchPutMetricPolicy: {}
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GeminiSecretName}*"

  # ─── Step Functions Express State Machine ──────────────────────────────

  AnalysisSfnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "epf-sentinel-sfn-analysis-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokePipelineLambdas
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt ClaimAgentFunction.Arn
                  - !GetAtt RulesAgentStepFunction.Arn
                  - !GetAtt SlaAgentFunction.Arn
                  - !GetAtt EvidenceAgentFunction.Arn
                  - !GetAtt GrievanceAgentFunction.Arn
                  - !GetAtt PersistRunFunction.Arn
                  - !GetAtt RecordFailureFunction.Arn
        - PolicyName: CloudWatchLogsDelivery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutLogEvents
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"

  AnalysisSfn:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "epf-sentinel-analysis-${Stage}"
      Type: EXPRESS
      DefinitionUri: state_machine.asl.json
      DefinitionSubstitutions:
        ClaimAgentFunctionArn:    !GetAtt ClaimAgentFunction.Arn
        RulesAgentStepFunctionArn: !GetAtt RulesAgentStepFunction.Arn
        SlaAgentFunctionArn:      !GetAtt SlaAgentFunction.Arn
        EvidenceAgentFunctionArn: !GetAtt EvidenceAgentFunction.Arn
        GrievanceAgentFunctionArn: !GetAtt GrievanceAgentFunction.Arn
        PersistRunFunctionArn:    !GetAtt PersistRunFunction.Arn
        RecordFailureFunctionArn: !GetAtt RecordFailureFunction.Arn
      Role: !GetAtt AnalysisSfnRole.Arn
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt AnalysisSfnLogGroup.Arn
        IncludeExecutionData: true
        Level: ALL

  # ─── Watchdog (Sweep) Function ──────────────────────────────────────────

  SweepFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-sweep-${Stage}"
      CodeUri: ../src/functions/sweep_function/
      Handler: app.handler
      Timeout: 300
      MemorySize: 512
      Description: "Daily watchdog that queries active claims and computes SLA"
      LoggingConfig:
        LogGroup: !Ref SweepFunctionLogGroup
      Environment:
        Variables:
          STAGE: !Ref Stage
          CLAIMS_TABLE_NAME: !Ref ClaimsTable
          ANALYSIS_RUNS_TABLE_NAME: !Ref AnalysisRunsTable
          STATUS_TRANSITIONS_TABLE_NAME: !Ref StatusTransitionsTable
          STATUS_NOTIFICATIONS_TOPIC_ARN: !Ref StatusNotificationsTopic
      Events:
        SweepSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 20 * * ? *) # 02:00 IST is 20:30 UTC
            Name: !Sub "epf-sentinel-sweep-schedule-${Stage}"
            Description: "Triggers SweepFunction daily at 02:00 IST"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ClaimsTable
        - DynamoDBReadPolicy:
            TableName: !Ref AnalysisRunsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StatusTransitionsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt StatusNotificationsTopic.TopicName
        - CloudWatchPutMetricPolicy: {}

  SweepFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "epf-sentinel-sweep-errors-${Stage}"
      AlarmDescription: "Triggers if SweepFunction throws an error"
      Namespace: "AWS/Lambda"
      MetricName: "Errors"
      Dimensions:
        - Name: FunctionName
          Value: !Ref SweepFunction
      Statistic: Sum
      Period: 300 # 5 minutes
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SweepFunctionSilentStopAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "epf-sentinel-sweep-silent-stop-${Stage}"
      AlarmDescription: "Triggers if SweepFunction hasn't successfully run in 26 hours"
      Namespace: "AWS/Lambda"
      MetricName: "Invocations"
      Dimensions:
        - Name: FunctionName
          Value: !Ref SweepFunction
      Statistic: Sum
      Period: 93600 # 26 hours in seconds
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

Outputs:
  ApiEndpoint:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub "epf-sentinel-ApiEndpoint-${Stage}"

  ClaimsTableName:
    Description: Claims DynamoDB table name
    Value: !Ref ClaimsTable
    Export:
      Name: !Sub "epf-sentinel-ClaimsTable-${Stage}"

  RuleChunksTableName:
    Description: RuleChunks DynamoDB table name
    Value: !Ref RuleChunksTable
    Export:
      Name: !Sub "epf-sentinel-RuleChunksTable-${Stage}"

  AnalysisRunsTableName:
    Description: AnalysisRuns DynamoDB table name
    Value: !Ref AnalysisRunsTable
    Export:
      Name: !Sub "epf-sentinel-AnalysisRunsTable-${Stage}"

  DocsBucketName:
    Description: S3 bucket for claim documents
    Value: !Ref DocsBucket
    Export:
      Name: !Sub "epf-sentinel-DocsBucket-${Stage}"

  SharedLayerArn:
    Description: ARN of the shared Lambda layer
    Value: !Ref SharedLayer
    Export:
      Name: !Sub "epf-sentinel-SharedLayer-${Stage}"

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "epf-sentinel-CognitoUserPoolId-${Stage}"

  CognitoUserPoolClientId:
    Description: Cognito User Pool App Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "epf-sentinel-CognitoUserPoolClientId-${Stage}"

  RulesAgentFunctionArn:
    Description: Rules Agent Lambda Function ARN
    Value: !GetAtt RulesAgentFunction.Arn
    Export:
      Name: !Sub "epf-sentinel-RulesAgentFunctionArn-${Stage}"

  AnalysisSfnArn:
    Description: ARN of the Express Step Functions analysis state machine
    Value: !Ref AnalysisSfn
    Export:
      Name: !Sub "epf-sentinel-AnalysisSfnArn-${Stage}"

  StartAnalysisFunctionArn:
    Description: StartAnalysis Lambda Function ARN
    Value: !GetAtt StartAnalysisFunction.Arn
    Export:
      Name: !Sub "epf-sentinel-StartAnalysisFunctionArn-${Stage}"

  GetRunFunctionArn:
    Description: GetRun Lambda Function ARN
    Value: !GetAtt GetRunFunction.Arn
    Export:
      Name: !Sub "epf-sentinel-GetRunFunctionArn-${Stage}"

  DocumentsTableName:
    Description: Documents DynamoDB table name
    Value: !Ref DocumentsTable
    Export:
      Name: !Sub "epf-sentinel-DocumentsTable-${Stage}"

  DocumentEventQueueUrl:
    Description: SQS Queue URL for document events
    Value: !Ref DocumentEventQueue
    Export:
      Name: !Sub "epf-sentinel-DocumentEventQueueUrl-${Stage}"

  DocumentEventDLQUrl:
    Description: SQS DLQ URL for failed document events
    Value: !Ref DocumentEventDLQ
    Export:
      Name: !Sub "epf-sentinel-DocumentEventDLQUrl-${Stage}"

  PresignUploadFunctionArn:
    Description: PresignUpload Lambda Function ARN
    Value: !GetAtt PresignUploadFunction.Arn
    Export:
      Name: !Sub "epf-sentinel-PresignUploadFunctionArn-${Stage}"

  GetDocumentFunctionArn:
    Description: GetDocument Lambda Function ARN
    Value: !GetAtt GetDocumentFunction.Arn
    Export:
      Name: !Sub "epf-sentinel-GetDocumentFunctionArn-${Stage}"

  ExtractDocumentFunctionArn:
    Description: ExtractDocument Lambda Function ARN
    Value: !GetAtt ExtractDocumentFunction.Arn
    Export:
      Name: !Sub "epf-sentinel-ExtractDocumentFunctionArn-${Stage}"
