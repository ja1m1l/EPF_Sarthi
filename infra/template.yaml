AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: EPF Sentinel - EPFO claim SLA tracker (Module 2.1 - rules ingestion + embeddings)

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 29
    Architectures: [x86_64]
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: epf-sentinel
        LOG_LEVEL: INFO
    Layers:
      - !Ref SharedLayer

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  AmplifyOrigin:
    Type: String
    Default: "https://placeholder.amplifyapp.com"
    Description: Full origin URL of the Amplify-hosted frontend.

  GitSha:
    Type: String
    Default: "local"
    Description: Short Git SHA injected by the CI pipeline / Makefile.

  MfaConfiguration:
    Type: String
    Default: "OFF"
    AllowedValues: ["OFF", "OPTIONAL", "REQUIRED"]
    Description: MFA setting for the Cognito user pool (OFF for v1, leave OPTIONAL/REQUIRED for later).

  GeminiSecretName:
    Type: String
    Default: "epf-sentinel/gemini-api-key"
    Description: Secrets Manager secret name holding the Gemini API key.

Resources:

  # Shared Lambda Layer
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "epf-sentinel-shared-${Stage}"
      Description: Shared Python utilities (logging, models)
      ContentUri: ../src/shared/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]
    Metadata:
      BuildMethod: makefile

  # DynamoDB - Claims
  ClaimsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "epf-sentinel-Claims-${Stage}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: claimId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: claimId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byStatus
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # DynamoDB - RuleChunks
  RuleChunksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "epf-sentinel-RuleChunks-${Stage}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - AttributeName: ruleSetVersion
          AttributeType: S
        - AttributeName: chunkId
          AttributeType: S
      KeySchema:
        - AttributeName: ruleSetVersion
          KeyType: HASH
        - AttributeName: chunkId
          KeyType: RANGE

  # DynamoDB - AnalysisRuns
  AnalysisRunsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "epf-sentinel-AnalysisRuns-${Stage}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - AttributeName: claimId
          AttributeType: S
        - AttributeName: runId
          AttributeType: S
      KeySchema:
        - AttributeName: claimId
          KeyType: HASH
        - AttributeName: runId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # S3 - epf-sentinel-docs
  DocsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "epf-sentinel-docs-${Stage}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended
      LifecycleConfiguration:
        Rules:
          - Id: expire-uploaded-docs
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins:
              - !Ref AmplifyOrigin
            AllowedHeaders: ["*"]
            MaxAge: 3600

  # ─── Cognito ─────────────────────────────────────────────────────────────

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "epf-sentinel-users-${Stage}"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      MfaConfiguration: !Ref MfaConfiguration
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolAddOns:
        AdvancedSecurityMode: AUDIT

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "epf-sentinel-client-${Stage}"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      PreventUserExistenceErrors: ENABLED

  # ─── CloudWatch Log Groups (14-day retention) ─────────────────────────────

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-health-${Stage}"
      RetentionInDays: 14

  CreateClaimFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-create-claim-${Stage}"
      RetentionInDays: 14

  ListClaimsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-list-claims-${Stage}"
      RetentionInDays: 14

  GetClaimFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/epf-sentinel-get-claim-${Stage}"
      RetentionInDays: 14

  # ─── API Gateway HTTP API ────────────────────────────────────────────────

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Description: EPF Sentinel HTTP API
      CorsConfiguration:
        AllowHeaders: ["Content-Type", "Authorization", "X-Correlation-Id"]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowOrigins:
          - !Ref AmplifyOrigin
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 100
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
              audience:
                - !Ref CognitoUserPoolClient
        # No DefaultAuthorizer — each protected function sets Auth.Authorizer explicitly.
        # The /health route is intentionally left public (no Auth block on HealthFunction).

  # ─── Lambda functions ────────────────────────────────────────────────────

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-health-${Stage}"
      CodeUri: ../src/functions/health/
      Handler: app.handler
      Description: Health-check endpoint - returns status, git sha, and UTC time (public, no auth)
      LoggingConfig:
        LogGroup: !Ref HealthFunctionLogGroup
      Environment:
        Variables:
          GIT_SHA: !Ref GitSha
          STAGE: !Ref Stage
      Events:
        HealthGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            # No Auth block — this route is intentionally public.
      Policies:
        - CloudWatchPutMetricPolicy: {}

  CreateClaimFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-create-claim-${Stage}"
      CodeUri: ../src/functions/create_claim/
      Handler: app.handler
      Description: POST /claims — create a new EPF claim (JWT-protected)
      LoggingConfig:
        LogGroup: !Ref CreateClaimFunctionLogGroup
      Environment:
        Variables:
          CLAIMS_TABLE_NAME: !Ref ClaimsTable
          STAGE: !Ref Stage
      Events:
        CreateClaimPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /claims
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClaimsTable

  ListClaimsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-list-claims-${Stage}"
      CodeUri: ../src/functions/list_claims/
      Handler: app.handler
      Description: GET /claims — list authenticated user's claims (JWT-protected)
      LoggingConfig:
        LogGroup: !Ref ListClaimsFunctionLogGroup
      Environment:
        Variables:
          CLAIMS_TABLE_NAME: !Ref ClaimsTable
          STAGE: !Ref Stage
      Events:
        ListClaimsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /claims
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClaimsTable

  GetClaimFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "epf-sentinel-get-claim-${Stage}"
      CodeUri: ../src/functions/get_claim/
      Handler: app.handler
      Description: GET /claims/{claimId} — fetch one claim (JWT-protected, tenant-scoped)
      LoggingConfig:
        LogGroup: !Ref GetClaimFunctionLogGroup
      Environment:
        Variables:
          CLAIMS_TABLE_NAME: !Ref ClaimsTable
          STAGE: !Ref Stage
      Events:
        GetClaimGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /claims/{claimId}
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClaimsTable

Outputs:
  ApiEndpoint:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub "epf-sentinel-ApiEndpoint-${Stage}"

  ClaimsTableName:
    Description: Claims DynamoDB table name
    Value: !Ref ClaimsTable
    Export:
      Name: !Sub "epf-sentinel-ClaimsTable-${Stage}"

  RuleChunksTableName:
    Description: RuleChunks DynamoDB table name
    Value: !Ref RuleChunksTable
    Export:
      Name: !Sub "epf-sentinel-RuleChunksTable-${Stage}"

  AnalysisRunsTableName:
    Description: AnalysisRuns DynamoDB table name
    Value: !Ref AnalysisRunsTable
    Export:
      Name: !Sub "epf-sentinel-AnalysisRunsTable-${Stage}"

  DocsBucketName:
    Description: S3 bucket for claim documents
    Value: !Ref DocsBucket
    Export:
      Name: !Sub "epf-sentinel-DocsBucket-${Stage}"

  SharedLayerArn:
    Description: ARN of the shared Lambda layer
    Value: !Ref SharedLayer
    Export:
      Name: !Sub "epf-sentinel-SharedLayer-${Stage}"

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "epf-sentinel-CognitoUserPoolId-${Stage}"

  CognitoUserPoolClientId:
    Description: Cognito User Pool App Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "epf-sentinel-CognitoUserPoolClientId-${Stage}"
