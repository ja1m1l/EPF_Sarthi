version = 0.1

[default.global.parameters]
stack_name = "epf-sentinel-dev"
region = "ap-south-1"

[default.build.parameters]
use_container = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
resolve_s3 = true
s3_prefix = "epf-sentinel"
parameter_overrides = "Stage=dev GitSha=local AmplifyOrigin=https://placeholder.amplifyapp.com MfaConfiguration=OFF"

[default.sync.parameters]
watch = true

[staging.global.parameters]
stack_name = "epf-sentinel-staging"
region = "ap-south-1"

[staging.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
resolve_s3 = true
s3_prefix = "epf-sentinel"
parameter_overrides = "Stage=staging GitSha=local AmplifyOrigin=https://placeholder.amplifyapp.com MfaConfiguration=OFF"

[prod.global.parameters]
stack_name = "epf-sentinel-prod"
region = "ap-south-1"

[prod.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
resolve_s3 = true
s3_prefix = "epf-sentinel"
# AmplifyOrigin and GitSha are overridden via CLI: make deploy STAGE=prod AMPLIFY_ORIGIN=https://...
parameter_overrides = "Stage=prod GitSha=local AmplifyOrigin=https://placeholder.amplifyapp.com MfaConfiguration=OFF"
